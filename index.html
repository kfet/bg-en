<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline Bulgarian–English dictionary" />
    <meta name="theme-color" content="#1565c0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kfet.github.io/bg-en/" />
    <meta property="og:title" content="БГ ↔ АН Речник / BG–EN Dictionary" />
    <meta property="og:description" content="Offline Bulgarian–English / English–Bulgarian dictionary with 110k+ entries. Works without internet." />
    <meta property="og:image" content="https://kfet.github.io/bg-en/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>БГ–АН Речник</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="header-title">
          <h1>БГ ↔ АН</h1>
          <p class="subtitle">Речник / Dictionary</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      </div>
    </header>

    <div id="offline-banner" class="offline-banner hidden" role="status" aria-live="polite">
      📴 Офлайн режим / Offline — речникът работи без интернет
    </div>

    <main>
      <div class="search-bar">
        <div class="input-wrapper">
          <input
            id="search-input"
            type="search"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
            autofocus
            placeholder="търси… / search…"
            aria-label="Search word"
          />
          <span id="dir-indicator" class="dir-indicator" aria-hidden="true"></span>
        </div>
      </div>

      <div id="progress-track" class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>

      <div id="results" class="results" role="list" aria-label="Search results"></div>
    </main>

    <footer class="site-footer">
      <p>
        Данни / Data:
        <a href="https://www.wikdict.com" target="_blank" rel="noopener noreferrer">WikiDict</a>
        &middot;
        <a href="https://kaikki.org/dictionary/Bulgarian/" target="_blank" rel="noopener noreferrer">kaikki.org</a>
        &middot;
        <a href="https://github.com/open-dict-data/ipa-dict" target="_blank" rel="noopener noreferrer">ipa-dict</a>
        &middot;
        <a href="https://github.com/unimorph/eng" target="_blank" rel="noopener noreferrer">UniMorph</a>
        &mdash;
        <a href="./data/NOTICE" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>
      </p>
      <p>
        <a href="https://github.com/kfet/bg-en" target="_blank" rel="noopener noreferrer">GitHub</a>
        &mdash; MIT
      </p>
    </footer>

    <div id="install-banner" class="install-banner hidden">
      <span>Инсталирай приложението за offline достъп</span>
      <button id="install-btn">Инсталирай</button>
      <button id="install-dismiss" aria-label="Dismiss">✕</button>
    </div>

    <div id="update-banner" class="update-banner hidden">
      <span>Налична е нова версия.</span>
      <button id="update-btn">Обнови</button>
    </div>

    <script type="module" src="./src/main.ts"></script>
    <noscript>
      <p style="padding:1rem;text-align:center;font-family:sans-serif">
        Тази страница изисква JavaScript. / This page requires JavaScript.
      </p>
    </noscript>
  </body>
</html>
