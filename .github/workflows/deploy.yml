name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Opt every Node-based action into the Node 24 runtime. GitHub forces this
# default in June 2026; setting it now silences the deprecation warning and
# matches what the runner will use anyway.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive data cache key from build_data.py VERSION
        id: datakey
        run: |
          version=$(sed -n 's/^VERSION *= *"\(.*\)"/\1/p' scripts/build_data.py | head -1)
          if [ -z "$version" ]; then
            echo "VERSION not found in scripts/build_data.py" >&2
            exit 1
          fi
          echo "build_data.py VERSION: $version"
          echo "key=wikdict-kaikki-ipadict-unimorph-kaikkien-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          # build_data.py declares its deps via PEP 723 inline-script metadata;
          # invalidate the uv cache when that block changes (replaces the
          # default uv.lock / requirements*.txt glob, neither of which exist).
          cache-dependency-glob: scripts/build_data.py

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache WikiDict SQLite + kaikki BG/EN + ipa-dict + unimorph
        uses: actions/cache@v5
        with:
          path: scripts/.cache
          key: ${{ steps.datakey.outputs.key }}

      - name: Build data files
        run: uv run scripts/build_data.py

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
