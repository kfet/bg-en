name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy.yml cache key matches build_data.py VERSION
        run: |
          version=$(python3 -c "
          import re, sys
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', open('scripts/build_data.py').read())
          if not m: sys.exit('VERSION not found in build_data.py')
          print(m.group(1))
          ")
          echo "build_data.py VERSION: $version"
          expected="wikdict-kaikki-ipadict-unimorph-kaikkien-${version}"
          if ! grep -qF "key: ${expected}" .github/workflows/deploy.yml; then
            echo "ERROR: Cache key in deploy.yml must be '${expected}' to match VERSION in build_data.py"
            echo "       Update the 'key:' under 'Cache WikiDict SQLite' to match."
            exit 1
          fi
          echo "✓ Cache key matches: ${expected}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache WikiDict SQLite + kaikki BG/EN + ipa-dict + unimorph
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: wikdict-kaikki-ipadict-unimorph-kaikkien-2025-11

      - name: Build data files
        run: uv run scripts/build_data.py

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
